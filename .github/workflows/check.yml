name: LT-02 synthetic check
on:
  workflow_dispatch:
  pull_request:
    types: [labeled]
  push:
    branches: [master, fixture-change]
    paths: ['.github/workflows/check.yml']
permissions:
  contents: read
  statuses: write
jobs:
  emit-fixture-status:
    runs-on: ubuntu-latest
    steps:
      - name: Report synthetic status from GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state=success -f context=build-and-test -f description=Synthetic-trusted-source --jq .id
